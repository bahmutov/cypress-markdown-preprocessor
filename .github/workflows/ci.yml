name: ci
on: push
jobs:
  test:
    # https://github.com/bahmutov/cypress-workflows
    uses: bahmutov/cypress-workflows/.github/workflows/split.yml@v2
    with:
      nE2E: 3
      command: npm test

  test-collect:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout
      - name: Check out source code 🛎
        uses: actions/checkout@v7
        with:
          # check out all commits to get accurate created date
          fetch-depth: 0
      - uses: bahmutov/npm-install@v1
      - name: Print fiddles 🖨️
        run: npm run demo:collect
    env:
      # we do not need to install Cypress to run this test
      CYPRESS_INSTALL_BINARY: 0

  release:
    needs: ['test', 'test-collect']
    runs-on: ubuntu-latest
    permissions:
      # allow the release step to comment on
      # issues, pull requests, and write to the repo
      contents: write
      issues: write
      pull-requests: write
      # Required for OIDC to let NPM registry know
      # that this workflow is trusted
      id-token: write

    steps:
      # important: the default Node version is v18
      # which gives us an auth error trying to release
      # so install v24 explicitly
      # https://github.com/actions/setup-node
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Semantic Release 🚀
        uses: cycjimmy/semantic-release-action@v6.0.0
        if: github.ref == 'refs/heads/main'
        with:
          branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
